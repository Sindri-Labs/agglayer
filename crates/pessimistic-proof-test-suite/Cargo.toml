[package]
name = "pessimistic-proof-test-suite"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ppgen"
path = "src/bin/ppgen.rs"

[[bin]]
name = "convertor"
path = "src/bin/convertor.rs"

[dependencies]
agglayer-primitives.workspace = true
agglayer-types = { path = "../agglayer-types", features = ["testutils"] }
pessimistic-proof = { path = "../pessimistic-proof" }
sindri = {git = "https://github.com/Sindri-Labs/sindri-rs.git"}
envy = "0.4.2"
tokio = { version = "1.0", features = ["full"] }
rmp-serde = "1.3.0"

base64.workspace = true
bincode.workspace = true
clap.workspace = true
dotenvy.workspace = true
ethers-signers.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sp1-sdk = { workspace = true }
sp1-core-machine.workspace = true
lazy_static.workspace = true
anyhow.workspace = true
rand.workspace = true
hex-literal = "0.4"
hex.workspace = true
tracing.workspace = true
uuid = { version = "1.11.0", features = ["v4", "fast-rng"] }
regex = "1.11"

[dev-dependencies]
rstest.workspace = true
tracing.workspace = true
